<!doctype html>
<html lang="en" data-theme="mesas">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | escape }}</title>
<meta name="description" content="{{ page.description | escape }}">
<link rel="stylesheet" href="core/base.css">
<!-- The core is this page: semantic markup with no look of its own. A theme dresses it (themes/<slug>/theme.css,
     effects.js, fragments.js); themes/manifest.js lists them. The bootstrap below picks ?theme=, else the visitor's
     saved choice, else the manifest's default, and writes that theme's stylesheets before the first paint. -->
<script src="themes/manifest.js"></script>
<script>(function () {
  var d = document.documentElement, M = window.minosThemes, q = null, s = null, t = null, i;
  function find(slug) { for (var j = 0; j < M.list.length; j++) if (M.list[j].slug === slug) return M.list[j]; return null; }
  try { q = new URLSearchParams(location.search).get('theme'); } catch (e) { q = null; }
  try { s = localStorage.getItem('minos.theme'); } catch (e) { s = null; }
  t = find(q) || find(s) || find(M.default) || M.list[0];
  if (find(q)) { try { localStorage.setItem('minos.theme', q); } catch (e) { /* storage blocked: this visit only */ } }
  d.className += ' js fx-wait';
  d.setAttribute('data-theme', t.slug);
  window.minosTheme = t.slug;
  var a = function (v) { return String(v).replace(/&/g, '&amp;').replace(/"/g, '&quot;'); };
  document.write((t.fonts ? '<link id="theme-fonts" rel="stylesheet" href="' + a(t.fonts) + '">' : '') +
    '<link id="theme-css" rel="stylesheet" href="' + a(t.css) + '">');
  // the theme's effects reveal the page once mounted; this is the floor if they never do
  setTimeout(function () { d.classList.remove('fx-wait'); }, 2500);
})();</script>
<noscript>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@400;700&amp;display=swap">
<link rel="stylesheet" href="themes/mesas/theme.css">
</noscript>
</head>
